# =============================================================================
# GeM Portal Integration — Docker Compose
# =============================================================================
# This file orchestrates all 4 services so the full project runs with a
# single command:  docker compose up --build
#
# Services:
#   postgres        → PostgreSQL database (port 5432)
#   document-service → FastAPI document processing + DB ORM (port 8000)
#   mock-api        → FastAPI mock government verification API (port 9000)
#   app             → React frontend + Express API server (port 5000)
#
# Your friend only needs Docker installed, then runs:
#   1. Copy .env.example → .env  and fill in GEMINI_API_KEY
#   2. docker compose up --build
#   3. Open http://localhost:5000
# =============================================================================

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine           # Lightweight official Postgres image
    container_name: gem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gem_portal           # Database name
      POSTGRES_USER: postgres           # DB username
      POSTGRES_PASSWORD: postgres       # DB password (change in production!)
    ports:
      - "5432:5432"                     # Expose to host for optional local tools
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Persist DB data across restarts
    healthcheck:
      # Wait until Postgres is ready to accept connections before starting dependents
      test: ["CMD-SHELL", "pg_isready -U postgres -d gem_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Document Processing Service (FastAPI + Python) ─────────────────────────
  document-service:
    build:
      context: ./document-service      # Build from document-service/Dockerfile
    container_name: gem_document_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Point to the postgres service (Docker internal DNS resolves 'postgres')
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gem_portal
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/gem_portal
    depends_on:
      postgres:
        condition: service_healthy     # Wait for DB health check to pass

  # ── Mock Government Verification API (FastAPI + Python) ────────────────────
  mock-api:
    build:
      context: ./MOCK-API-main         # Build from MOCK-API-main/Dockerfile
    container_name: gem_mock_api
    restart: unless-stopped
    ports:
      - "9000:9000"
    # No database needed — reads from local JSON files in data/

  # ── React Frontend + Express API Server (Node.js) ──────────────────────────
  app:
    build:
      context: .                       # Build from root Dockerfile
    container_name: gem_app
    restart: unless-stopped
    ports:
      - "5000:5000"                    # Main app port — open http://localhost:5000
    environment:
      # API key for Gemini AI — MUST be set in your .env file
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Internal Docker DNS: service names resolve to container IPs
      PYTHON_DOC_SERVICE_URL: http://document-service:8000/parse-document
      MOCK_GOV_API_URL: http://mock-api:9000

      # Points to itself — used for self-referential links
      APP_URL: http://localhost:5000

      NODE_ENV: production
    depends_on:
      - document-service
      - mock-api

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    # Docker manages this volume; data persists even when containers are stopped
